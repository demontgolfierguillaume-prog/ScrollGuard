# Compilation cloud : à chaque push sur main, GitHub compile l'application,
# exécute les tests du moteur de règles et publie l'APK de debug en artefact
# téléchargeable (onglet Actions → dernier run → "scrollguard-debug-apk").
name: Android CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Tests du moteur de règles
        run: gradle :core:rules:test

      - name: Compiler l'APK de debug
        run: gradle :app:assembleDebug

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: scrollguard-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # La release « latest » offre un lien de téléchargement stable :
      # https://github.com/demontgolfierguillaume-prog/ScrollGuard/releases/tag/latest
      - name: Mettre à jour la release « latest »
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || \
            gh release create latest --title "Dernière version (build automatique)" \
              --notes "APK de debug régénéré à chaque mise à jour du code." --prerelease
          gh release upload latest app/build/outputs/apk/debug/app-debug.apk --clobber
