# Compilation cloud : à chaque push sur main, GitHub compile l'application,
# exécute les tests du moteur de règles et publie l'APK de debug en artefact
# téléchargeable (onglet Actions → dernier run → "scrollguard-debug-apk").
name: Android CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Tests du moteur de règles
        run: gradle :core:rules:test

      - name: Compiler l'APK de debug
        run: gradle :app:assembleDebug

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: scrollguard-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
